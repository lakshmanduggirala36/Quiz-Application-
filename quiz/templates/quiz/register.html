<!DOCTYPE html><html>
<head>
<title>Quiz Registration</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"><style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0f172a;
    color:white;

    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

/* REGISTER BOX */

.box{
    width:100%;
    max-width:520px;
    background:#020617;
    padding:40px;
    border-radius:14px;
    box-shadow:0 0 25px rgba(0,0,0,0.4);
}

.box h2{
    text-align:center;
    font-size:28px;
    margin-bottom:20px;
}

.box h3{
    margin-top:25px;
    font-size:18px;
}

input,button{
    width:100%;
    padding:14px;
    margin-top:14px;
    border-radius:8px;
    border:none;
    font-size:16px;
}

input{
    outline:none;
}

button{
    background:#3b82f6;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

p{
    text-align:center;
    margin-top:18px;
}

a{
    color:#38bdf8;
    text-decoration:none;
}

hr{
    margin-top:25px;
    border:0;
    height:1px;
    background:#1e293b;
}

.error{
    color:red;
    text-align:center;
    margin-top:10px;
}

</style></head><body><div class="box"><h2>Quiz Registration</h2>{% if error %}

<p class="error">{{ error }}</p>
{% endif %}<!-- QUICK QUIZ --><h3>Start Quick Quiz</h3><form method="POST" action="/quiz/quiz-start/">{% csrf_token %}

<input type="text" name="name" placeholder="Enter your name" required><button type="submit" name="quick_quiz">Start Quiz</button>

</form><hr><!-- CREATE ACCOUNT --><h3>Create Account</h3><form method="POST" action="/quiz/">{% csrf_token %}

<input type="text" name="username" placeholder="Username" required><input type="email" name="email" placeholder="Email" required><input type="password" name="password" placeholder="Password" required><input type="text" name="phone" placeholder="Phone Number" required><button type="submit" name="register">Register</button>

</form><p>
Already registered?
<a href="{% url 'login' %}">Login</a>
</p></div></body>
</html>
