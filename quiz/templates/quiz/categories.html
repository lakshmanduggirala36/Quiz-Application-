<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categories</title>

<style>
body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
}

/* Navbar */
.navbar{
    display:flex;
    justify-content:space-between;
    padding:15px 40px;
    background:rgba(0,0,0,0.2);
}

.navbar a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-size:14px;
}

/* Main Container */
.container{
    text-align:center;
    margin-top:80px;
}

.cards{
    display:flex;
    justify-content:center;
    gap:40px;
    margin-top:50px;
    flex-wrap:wrap;
}

.card{
    background: rgba(0,0,0,0.4);
    padding:30px;
    width:250px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.5);
    transition:0.3s;
}

.card:hover{
    transform: translateY(-5px);
}

.card h3{
    margin-bottom:10px;
}

.card p{
    font-size:14px;
    opacity:0.8;
}

/* Button */
.btn{
    margin-top:20px;
    padding:10px 20px;
    border:none;
    border-radius:20px;
    background: linear-gradient(90deg,#00f2fe,#4facfe);
    color:white;
    cursor:pointer;
}

.footer{
    margin-top:100px;
    text-align:center;
    font-size:13px;
    opacity:0.7;
}
</style>
</head>

<body>

<!-- Navbar -->
<div class="navbar">
    <div><strong>Smart Assessment</strong></div>

    <div>
        <a href="{% url 'quiz_settings' %}">Home</a>
        <a href="{% url 'quiz_settings' %}">Categories</a>
        <a href="/accounts/logout/">Logout</a>
    </div>
</div>

<!-- Main Section -->
<div class="container">
    <h2>Choose Your Domain</h2>

    <div class="cards">

        <div class="card">
            <h3>📚 Academic</h3>
            <p>Educational and subject-based quizzes</p>
            <button class="btn" onclick="selectCategory('Academic')">Explore →</button>
        </div>

        <div class="card">
            <h3>🎬 Entertainment</h3>
            <p>Fun and entertainment quizzes</p>
            <button class="btn" onclick="selectCategory('Entertainment')">Explore →</button>
        </div>

        <div class="card">
            <h3>🌍 General Knowledge</h3>
            <p>General awareness quizzes</p>
            <button class="btn" onclick="selectCategory('General Knowledge')">Explore →</button>
        </div>

    </div>
</div>

<div class="footer">
    © 2026 Smart Assessment & Question Generation System
</div>

<script>

function selectCategory(category){

    /* Save category */
    localStorage.setItem("selectedCategory", category);

    /* Redirect to Django quiz settings page */
    window.location.href = "{% url 'quiz_settings' %}?category=" + category;

}

</script>

</body>
</html>
