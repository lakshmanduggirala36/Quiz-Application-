<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0f172a;
    color:white;

    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.box{
    width:100%;
    max-width:480px;
    background:#020617;
    padding:40px;
    border-radius:14px;
    box-shadow:0 0 25px rgba(0,0,0,0.4);
}

.box h2{
    text-align:center;
    margin-bottom:20px;
}

input,button{
    width:100%;
    padding:12px;
    margin-top:12px;
    border:none;
    border-radius:8px;
    font-size:16px;
}

button{
    background:#22c55e;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

p{
    text-align:center;
    margin-top:15px;
}

a{
    color:#38bdf8;
    text-decoration:none;
}
</style>

</head>

<body>

<div class="box">

<h2>Login</h2>

<form method="POST">
{% csrf_token %}

<input type="text" name="username" placeholder="Username" required>

<input type="password" name="password" placeholder="Password" required>

<button type="submit">Login</button>

</form>

<p>
New user?
<a href="{% url 'register' %}">Register</a>
</p>

</div>

</body>
</html>
